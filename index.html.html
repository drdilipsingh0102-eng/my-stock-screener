    // Synthetic Candles generator
    const generateCandles = (basePrice, count = 24) => {
      const candles = [];
      let curr = basePrice * (1 - count * 0.001);
      const now = Date.now();
      for (let i = 0; i < count; i++) {
        const time = new Date(now - (count - i) * 15 * 60 * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const delta = (Math.random() - 0.48) * (curr * 0.004);
        const open = curr;
        const close = +(curr + delta).toFixed(2);
        const high = +(Math.max(open, close) + Math.random() * (curr * 0.0025)).toFixed(2);
        const low = +(Math.min(open, close) - Math.random() * (curr * 0.0025)).toFixed(2);
        curr = close;
        candles.push({ time, open, high, low, close });
      }
      return candles;
    };

    const evaluateSignal = (rsi, price, vwap, ema20, supertrendDir) => {
      let score = 0;
      if (rsi > 60) score += 1;
      if (rsi < 40) score -= 1;
      if (price > vwap) score += 1.5; else score -= 1.5;
      if (price > ema20) score += 1; else score -= 1;
      if (supertrendDir === 'BULL') score += 1.5; else score -= 1.5;
      if (score >= 3) return 'Strong Buy';
      if (score >= 1) return 'Buy';
      if (score <= -3) return 'Strong Sell';
      if (score <= -1) return 'Sell';
      return 'Neutral';
    };

    const initStocks = () => {
      return INITIAL_INDIAN_STOCKS.map(s => {
        const price = s.base;
        const changePct = +(Math.random() * 3.6 - 1.6).toFixed(2);
        const open = +(price / (1 + changePct / 100)).toFixed(2);
        const high = +(Math.max(price, open) + price * 0.009).toFixed(2);
        const low = +(Math.min(price, open) - price * 0.009).toFixed(2);
        const vwap = +(price * (1 + (Math.random() * 0.006 - 0.003))).toFixed(2);
        const ema20 = +(price * (1 + (Math.random() * 0.008 - 0.004))).toFixed(2);
        const rsi = +(38 + Math.random() * 32).toFixed(1);
        const supertrendDir = price > vwap ? 'BULL' : 'BEAR';
        const volumeShares = Math.floor(Math.random() * 4500000 + 450000);
        const signal = evaluateSignal(rsi, price, vwap, ema20, supertrendDir);
        const week52High = +(price * 1.14).toFixed(2);
        const week52Low = +(price * 0.76).toFixed(2);
        return {
          ...s,
          price,
          open,
          high,
          low,
          vwap,
          ema20,
          rsi,
          supertrendDir,
          changePct,
          changeVal: +((price * changePct) / 100).toFixed(2),
          volumeShares,
          signal,
          week52High,
          week52Low,
          tickDir: 0,
          candles: generateCandles(price, 20)
        };
      });
    };

      // Alerts
      const [alerts, setAlerts] = useState([

      const [newAlertMetric, setNewAlertMetric] = useState('Price');
      const [newAlertThreshold, setNewAlertThreshold] = useState('');

      // Catch PWA Install Event
      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setPwaPrompt(e);
        });
      }, []);

      const handleInstallPwa = () => {
        if (pwaPrompt) {
          pwaPrompt.prompt();
          pwaPrompt.userChoice.then(() => setPwaPrompt(null));
        } else {
          alert("To install: Open browser menu (⋮ on Chrome or Share ⎋ on Safari) and tap 'Add to Home screen' or 'Install App'.");
        }
      };

      // Live Ticker simulation
      useEffect(() => {
        if (!isLive) return;
        const timer = setInterval(() => {
          setStocks(prev => {
            const count = Math.floor(Math.random() * 3) + 2;
            const idxs = new Set();
            while (idxs.size < count) idxs.add(Math.floor(Math.random() * prev.length));

            return prev.map((stk, idx) => {
              if (!idxs.has(idx)) return { ...stk, tickDir: 0 };
              const tickPct = (Math.random() * 0.003 - 0.0014);
              const delta = +(stk.price * tickPct).toFixed(2);
              const newPrice = +(stk.price + delta).toFixed(2);
              const newHigh = Math.max(stk.high, newPrice);
              const newLow = Math.min(stk.low, newPrice);
              const newChangeVal = +(stk.changeVal + delta).toFixed(2);
              const newChangePct = +(((newPrice - stk.open) / stk.open) * 100).toFixed(2);
              const newRsi = +Math.max(15, Math.min(85, stk.rsi + (Math.random() * 0.6 - 0.28))).toFixed(1);
              const newVwap = +((stk.vwap * 0.998) + (newPrice * 0.002)).toFixed(2);
              const newSuper = newPrice > newVwap ? 'BULL' : 'BEAR';
              const newSignal = evaluateSignal(newRsi, newPrice, newVwap, stk.ema20, newSuper);

              return {
                ...stk,
                price: newPrice,
                high: newHigh,
                low: newLow,
                changeVal: newChangeVal,
                changePct: newChangePct,
                rsi: newRsi,
                vwap: newVwap,
                supertrendDir: newSuper,
                signal: newSignal,
                tickDir: delta > 0 ? 1 : delta < 0 ? -1 : 0

            });
          });
        }, 1200);
        return () => clearInterval(timer);

        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100 max-w-md mx-auto shadow-2xl relative border-x border-slate-900">
          {/* MOBILE HEADER */}
          <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 pt-safe">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-bold text-white shadow-md shadow-orange-600/30">
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                    <polyline points="16 7 22 7 22 13"></polyline>
                  </svg>
                </div>
                <div>
                  <h1 className="text-base font-extrabold tracking-tight text-white leading-tight">BHARAT TRADE</h1>
                  <div className="flex items-center gap-1.5 text-[10px] text-slate-400 font-mono">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>NSE Live</span>
                    <span>•</span>
                    <span>{stocks.length} Stocks</span>
                  </div>
                </div>
              </div>

              {/* Action Buttons: Live Pause & PWA Install */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsLive(!isLive)}
                  className={`px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1 border transition-all ${
                    isLive
                      ? 'bg-emerald-950/80 border-emerald-700 text-emerald-300'
                      : 'bg-rose-950/80 border-rose-700 text-rose-300'
                  }`}
                >
                  <span className={`w-2 h-2 rounded-full ${isLive ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                  <span>{isLive ? 'LIVE' : 'PAUSED'}</span>
                </button>

                <button
                  onClick={handleInstallPwa}
                  className="px-2.5 py-1 bg-orange-600 hover:bg-orange-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1 shadow-md shadow-orange-600/20 active:scale-95 transition-transform"
                >
                  <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  <span>Install</span>
                </button>
              </div>
            </div>

            {/* SEARCH BOX */}
            <div className="mt-3 relative">
              <svg className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input
                type="text"
                placeholder="Search stocks (Reliance, Tata, HDFC)..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-8 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors"
              />
              {search && (
                <button onClick={() => setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-bold">
                  ✕
                </button>
              )}
            </div>

            {/* QUICK PRESET CHIPS (HORIZONTAL SCROLL) */}
            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar mt-2.5 pb-0.5">
              {[
                { id: 'All', label: 'All' },
                { id: 'Top Gainers', label: '🚀 Gainers' },
                { id: 'Top Losers', label: '📉 Losers' },
                { id: 'Above VWAP', label: '⚡ Above VWAP' },
                { id: 'RSI < 35', label: '💎 RSI < 35' },
                { id: 'High Delivery', label: '📦 Delivery %' }
              ].map(p => (
                <button
                  key={p.id}
                  onClick={() => setPreset(p.id)}
                  className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap border transition-all ${
                    preset === p.id
                      ? 'bg-orange-600 text-white border-orange-500 shadow-sm'
                      : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white'
                  }`}
                >
                  {p.label}
                </button>
              ))}
            </div>
          </header>

          {/* SUB-BAR: INDEX SELECTOR & VIEW TOGGLE */}
          <div className="px-4 py-2 bg-slate-900/40 border-b border-slate-800/60 flex items-center justify-between text-xs text-slate-400">
            <div className="flex items-center gap-1.5">
              <span>Index:</span>
              <select
                value={indexFilter}
                onChange={e => setIndexFilter(e.target.value)}
                className="bg-slate-950 border border-slate-800 rounded px-2 py-0.5 text-xs text-slate-200 focus:outline-none"
              >
                <option value="All">All ({stocks.length})</option>
                <option value="Nifty 50">Nifty 50</option>
                <option value="Bank Nifty">Bank Nifty</option>
                <option value="F&O Momentum">F&O Momentum</option>
              </select>
            </div>

            <div className="flex items-center gap-1">
              <span className="font-mono text-[11px] text-orange-400 font-bold">{filteredStocks.length}</span>
              <span className="text-[11px]">stocks</span>
            </div>
          </div>

          {/* MAIN SCROLLABLE CONTENT */}
          <main className="flex-1 overflow-y-auto p-3 space-y-2.5 pb-24">
            {activeTab === 'alerts' ? (
              /* ALERTS TAB CONTENT */
              <div className="space-y-3">
                <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <h3 className="text-sm font-bold text-white mb-2">Set Price & Indicator Trigger</h3>
                  <div className="space-y-2.5 text-xs">
                    <div>
                      <label className="text-slate-400 block mb-1">Stock</label>
                      <select
                        value={newAlertSymbol}
                        onChange={e => setNewAlertSymbol(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                      >
                        {stocks.map(s => <option key={s.symbol} value={s.symbol}>{s.symbol}</option>)}
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-slate-400 block mb-1">Metric</label>
                        <select
                          value={newAlertMetric}
                          onChange={e => setNewAlertMetric(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                        >
                          <option value="Price">Price (₹)</option>
                          <option value="RSI">RSI</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">Target Value</label>
                        <input
                          type="number"
                          placeholder="e.g. 3050"
                          value={newAlertThreshold}
                          onChange={e => setNewAlertThreshold(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                        />
                      </div>
                    </div>

                    <button
                      onClick={() => {
                        if (!newAlertThreshold) return;
                        setAlerts(prev => [...prev, {
                          id: Date.now(),
                          symbol: newAlertSymbol,
                          metric: newAlertMetric,
                          condition: 'Above',
                          threshold: parseFloat(newAlertThreshold)
                        }]);
                        setNewAlertThreshold('');
                      }}
                      className="w-full py-2 bg-orange-600 hover:bg-orange-500 font-bold text-white rounded-lg transition-colors mt-2"
                    >
                      Create Alert
                    </button>
                  </div>
                </div>

                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Active Triggers</h4>
                  {alerts.map(a => (
                    <div key={a.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between text-xs">
                      <div>
                        <div className="font-bold text-white text-sm">{a.symbol}</div>
                        <div className="text-slate-400 font-mono text-[11px]">
                          Trigger when {a.metric} &gt;= {a.threshold}
                        </div>
                      </div>
                      <button
                        onClick={() => setAlerts(prev => prev.filter(x => x.id !== a.id))}
                        className="text-rose-400 p-2 hover:bg-rose-950/40 rounded-lg"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            ) : filteredStocks.length === 0 ? (
              <div className="text-center py-16 text-slate-500 text-xs space-y-2">
                <p>No stocks match current screening parameters.</p>
                <button
                  onClick={() => { setPreset('All'); setIndexFilter('All'); setSearch(''); }}
                  className="px-3 py-1 bg-orange-950 text-orange-400 rounded-lg border border-orange-800 text-xs"
                >
                  Reset All Filters
                </button>
              </div>
            ) : (
              /* MOBILE TOUCH CARDS (SWIPE & TAP FRIENDLY) */
              filteredStocks.map(s => {
                const isPos = s.changePct >= 0;
                const isStarred = watchlist.includes(s.symbol);
                const flash = s.tickDir === 1 ? 'border-emerald-500/80 bg-emerald-950/20' : s.tickDir === -1 ? 'border-rose-500/80 bg-rose-950/20' : 'border-slate-800/80 bg-slate-900/60';

                return (
                  <div
                    key={s.symbol}
                    onClick={() => setSelectedStock(s)}
                    className={`rounded-2xl border p-3.5 transition-all active:scale-[0.98] cursor-pointer shadow-sm ${flash}`}
                  >
                    {/* Card Top Row: Symbol, Star, Price & Change */}
                    <div className="flex items-start justify-between">
                      <div className="flex items-start gap-2">
                        <button
                          onClick={e => toggleWatchlist(s.symbol, e)}
                          className="pt-0.5 text-slate-500 active:scale-125 transition-transform"
                        >
                          <svg className={`w-4 h-4 ${isStarred ? 'fill-amber-400 text-amber-400' : 'text-slate-600'}`} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                          </svg>
                        </button>
                        <div>
                          <div className="flex items-center gap-1.5">
                            <span className="font-bold text-white text-sm tracking-tight">{s.symbol}</span>
                            <span className="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 font-sans">
                              {s.sector.split(' ')[0]}
                            </span>
                          </div>
                          <span className="text-[11px] text-slate-400 truncate block max-w-[170px]">{s.name}</span>
                        </div>
                      </div>

                      <div className="text-right">
                        <div className="text-base font-bold font-mono text-white">
                          ₹{s.price.toLocaleString('en-IN', { minimumFractionDigits: 2 })}
                        </div>
                        <div className={`text-xs font-mono font-semibold flex items-center justify-end gap-0.5 ${isPos ? 'text-emerald-400' : 'text-rose-400'}`}>
                          <span>{isPos ? '▲' : '▼'}</span>
                          <span>{isPos ? '+' : ''}{s.changePct.toFixed(2)}%</span>
                        </div>
                      </div>
                    </div>

                    {/* Card Bottom Row: Micro Metrics (VWAP, RSI, Signal, Supertrend) */}
                    <div className="mt-3 pt-2.5 border-t border-slate-800/80 flex items-center justify-between text-[11px]">
                      <div className="flex items-center gap-2 font-mono">
                        <span className="text-slate-400">
                          VWAP: <strong className={s.price >= s.vwap ? 'text-emerald-400' : 'text-rose-400'}>₹{s.vwap}</strong>
                        </span>
                        <span className="text-slate-600">|</span>
                        <span className="text-slate-400">
                          RSI: <strong className={s.rsi >= 70 ? 'text-amber-400' : s.rsi <= 30 ? 'text-cyan-400' : 'text-slate-200'}>{s.rsi}</strong>
                        </span>
                      </div>

                      <div className="flex items-center gap-1.5">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border ${
                          s.signal.includes('Buy')
                            ? 'bg-emerald-950/80 text-emerald-300 border-emerald-800'
                            : s.signal.includes('Sell')
                            ? 'bg-rose-950/80 text-rose-300 border-rose-800'
                            : 'bg-slate-800 text-slate-300 border-slate-700'
                        }`}>
                          {s.signal}
                        </span>
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </main>

          {/* BOTTOM NAVIGATION BAR (NATIVE MOBILE FEEL) */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 z-40 pb-safe">
            <div className="grid grid-cols-3 h-14">
              <button
                onClick={() => setActiveTab('screener')}
                className={`flex flex-col items-center justify-center gap-1 transition-colors ${
                  activeTab === 'screener' ? 'text-orange-500 font-bold' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span className="text-[10px]">Screener</span>
              </button>

              <button
                onClick={() => setActiveTab('watchlist')}
                className={`flex flex-col items-center justify-center gap-1 transition-colors ${
                  activeTab === 'watchlist' ? 'text-orange-500 font-bold' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill={activeTab === 'watchlist' ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                <span className="text-[10px]">Watchlist ({watchlist.length})</span>
              </button>

              <button
                onClick={() => setActiveTab('alerts')}
                className={`flex flex-col items-center justify-center gap-1 transition-colors ${
                  activeTab === 'alerts' ? 'text-orange-500 font-bold' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span className="text-[10px]">Alerts ({alerts.length})</span>
              </button>
            </div>
          </nav>

          {/* MOBILE BOTTOM SHEET / DRILLDOWN MODAL */}
          {currentSelectedStock && (
            <div className="fixed inset-0 z-50 flex flex-col justify-end bg-black/80 backdrop-blur-sm">
              <div className="bg-slate-900 border-t border-slate-700 rounded-t-3xl max-h-[85vh] w-full max-w-md mx-auto overflow-y-auto p-4 space-y-4 pb-safe animate-in slide-in-from-bottom duration-200">
                {/* Pull handle & Close bar */}
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <div className="w-9 h-9 rounded-xl bg-orange-950 border border-orange-800 flex items-center justify-center font-bold text-orange-400 text-xs">
                      {currentSelectedStock.symbol.slice(0, 3)}
                    </div>
                    <div>
                      <h2 className="text-base font-bold text-white">{currentSelectedStock.symbol}</h2>
                      <span className="text-[11px] text-slate-400">{currentSelectedStock.name}</span>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <div className="text-right">
                      <div className="font-mono font-bold text-sm text-white">₹{currentSelectedStock.price}</div>
                      <div className={`text-[11px] font-mono font-bold ${currentSelectedStock.changePct >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {currentSelectedStock.changePct >= 0 ? '+' : ''}{currentSelectedStock.changePct.toFixed(2)}%
                      </div>
                    </div>
                    <button
                      onClick={() => setSelectedStock(null)}
                      className="p-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* 15-MINUTE SVG CANDLESTICK CHART */}
                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800">
                  <div className="flex items-center justify-between mb-2 text-xs">
                    <span className="font-bold text-slate-300">15-Min Candlesticks</span>
                    <span className="font-mono text-[10px] text-slate-400">High ₹{currentSelectedStock.high} | Low ₹{currentSelectedStock.low}</span>
                  </div>
                  <div className="h-36 w-full">
                    <svg className="w-full h-full" viewBox="0 0 400 120" preserveAspectRatio="none">
                      {(() => {
                        const c = currentSelectedStock.candles;
                        const minP = Math.min(...c.map(d => d.low));
                        const maxP = Math.max(...c.map(d => d.high));
                        const range = maxP - minP || 1;
                        const getY = val => 110 - ((val - minP) / range) * 100;
                        const w = 400 / c.length;
                        return c.map((candle, i) => {
                          const isGreen = candle.close >= candle.open;
                          const x = i * w + w / 2;
                          const yH = getY(candle.high);
                          const yL = getY(candle.low);
                          const yO = getY(candle.open);
                          const yC = getY(candle.close);
                          const top = Math.min(yO, yC);
                          const h = Math.max(2, Math.abs(yC - yO));
                          const color = isGreen ? '#10b981' : '#f43f5e';
                          return (
                            <g key={i}>
                              <line x1={x} y1={yH} x2={x} y2={yL} stroke={color} strokeWidth="1" />
                              <rect x={x - w * 0.3} y={top} width={w * 0.6} height={h} fill={color} rx="1" />
                            </g>
                          );
                        });
                      })()}
                    </svg>
                  </div>
                </div>

                {/* INTRADAY BENCHMARKS */}
                <div className="grid grid-cols-2 gap-2 text-xs font-mono">
                  <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <div className="text-slate-400 text-[10px]">Intraday VWAP</div>
                    <div className="text-sm font-bold text-orange-400">₹{currentSelectedStock.vwap}</div>
                  </div>
                  <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <div className="text-slate-400 text-[10px]">Supertrend Status</div>
                    <div className={`text-sm font-bold ${currentSelectedStock.supertrendDir === 'BULL' ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {currentSelectedStock.supertrendDir === 'BULL' ? 'BULLISH' : 'BEARISH'}
                    </div>
                  </div>
                  <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <div className="text-slate-400 text-[10px]">Delivery Volume %</div>
                    <div className="text-sm font-bold text-slate-200">{currentSelectedStock.deliveryPct}%</div>
                  </div>
                  <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <div className="text-slate-400 text-[10px]">F&O Lot Size</div>
                    <div className="text-sm font-bold text-slate-200">{currentSelectedStock.lotSize} Qty</div>
                  </div>
                </div>

                {/* CLASSIC PIVOT POINTS */}
                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800">
                  <div className="text-xs font-bold text-slate-300 mb-2">Classic Pivot Levels (NSE)</div>
                  {(() => {
                    const h = currentSelectedStock.high;
                    const l = currentSelectedStock.low;
                    const c = currentSelectedStock.price;
                    const pp = +((h + l + c) / 3).toFixed(2);
                    const r1 = +(2 * pp - l).toFixed(2);
                    const s1 = +(2 * pp - h).toFixed(2);
                    return (
                      <div className="space-y-1 text-xs font-mono">
                        <div className="flex justify-between text-rose-400"><span>Resistance 1 (R1)</span><span>₹{r1}</span></div>
                        <div className="flex justify-between text-orange-400 font-bold bg-orange-950/40 px-1.5 py-0.5 rounded"><span>Pivot Point (PP)</span><span>₹{pp}</span></div>
                        <div className="flex justify-between text-emerald-400"><span>Support 1 (S1)</span><span>₹{s1}</span></div>
                      </div>
                    );
                  })()}
                </div>

                <button
                  onClick={() => setSelectedStock(null)}
                  className="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-white font-bold rounded-xl transition-colors text-xs"
                >
                  Close Breakdown
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
